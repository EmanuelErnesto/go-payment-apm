input {
  # Filebeat ships the container's stdout with at-least-once delivery
  # (acks + backpressure + registry), replacing the old tcp/json_lines input.
  beats {
    port => 5044
  }
}

filter {
  # The API already writes ECS JSON (ecszap); just lift it to the event root.
  json {
    source               => "message"
    skip_on_invalid_json => true
    # The raw line would double the stored size; the parsed fields are enough.
    remove_field         => ["[event][original]"]
  }
}

output {
  elasticsearch {
    hosts               => ["http://elasticsearch:9200"]
    data_stream         => "true"
    data_stream_type    => "logs"
    data_stream_dataset => "payments_api"
  }
}

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "docs", "deploy", "migrations", "internal/application/port/mocks"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  send_interrupt = true
  kill_delay = "2s"
  stop_on_error = true

# No Windows o binário precisa da extensão .exe e o caminho é passado ao cmd.exe,
# que não aceita "./" nem "/" como separador.
[build.windows]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  entrypoint = ["tmp\\api.exe"]

[misc]
  clean_on_exit = true
